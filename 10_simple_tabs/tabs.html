<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Tabs</title>
    <link rel="stylesheet" href="tabs.css">
</head>
<body>
    <section class="tab">
        <div class="tab-header">

            <button class="btn-tab active">First Tab</button>
            <button class="btn-tab">Second Tab</button>
            <button class="btn-tab">Third Tab</button>
            <button class="btn-tab">Fourth Tab</button>
        </div>

        <div class="tab-content">
        <div class="tab-box active"><p></p>First Tab Content to be displayed here</p></div>

        </div>
    </section>
</body>
<script src="script.js"></script>
</html>
